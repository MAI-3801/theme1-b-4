<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HOMESTOCK</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<h1>HOMESTOCK</h1>
	<div class="item-tab">
    	<button data-type="all">すべて</button>
    	<button data-type="食品">食品</button>
    	<button data-type="日用品">日用品</button>
    	<button data-type="その他">その他</button>
	</div>

	<ul id="itemlist" class="item-list">
		<!-- 登録したアイテムをここに表示します -->
		<li class="item" data-type="食品">
			<span class="item-name">卵</span>
			<input class="item-num" type="number" value="10" min="0">
			<span class="item-unit">個</span>
			<button class="btn-edit">編集</button>
		</li>
	</ul>
	<button id="btn-add" type="button">追加</button>




	<div id="pop-up" role="dialog" aria-modal="true" aria-labelledby="popup-title" hidden>
		<div class="popup-content">
			<h2 id="popup-title">アイテムを追加</h2>
			<label for="input-name">名前</label>
			<input id="input-name" type="text" name="name">
			<label for="input-num">個数</label>
			<input id="input-num" type="number" name="num">
			<label for="input-unit">単位</label>
			<input id="input-unit" type="text" name="unit">
			<label for="input-type">カテゴリ</label>
			<select id="input-type">
    			<option value="食品">食品</option>
    			<option value="日用品">日用品</option>
    			<option value="その他">その他</option>
			</select>
			<button id="btn-confirm" type="button">確定</button>
			<button id="btn-cancel" type="button">閉じる</button>
		</div>
	</div>

	

	<script src="app.js"></script>
</body>
</html>
